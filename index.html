<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10132e">
    <title>Bizim Hikâyemiz ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="inside-hearts" aria-hidden="true">
            <span>♡</span>
            <span>♡</span>
            <span>♡</span>
            <span>♡</span>
            <span>♡</span>
            <span>♡</span>
            <span>♡</span>
        </div>

        <div class="page-content">

            <h1>Sana özel bir yer… ❤️</h1>

            <p>Buraya sadece sen girebilirsin.</p>

            <form id="loginForm">
                <input
                    id="passwordInput"
                    type="password"
                    placeholder="Şifreni gir"
                    aria-label="Şifreni gir"
                    autocomplete="off"
                    required
                >

                <button type="submit">Giriş Yap ❤️</button>
            </form>

        </div>

    </div>

    <!-- ARKA PLAN MÜZİĞİ -->
    <audio id="siteMusic" loop></audio>

    <script>
        const container = document.querySelector(".container");
        const siteMusic = document.getElementById("siteMusic");
        const loginForm = document.getElementById("loginForm");
        const passwordInput = document.getElementById("passwordInput");
        // VİDEO OYNARKEN ARKA PLAN ŞARKISINI DURDUR
document.addEventListener("play", function(event) {
    if (event.target instanceof HTMLVideoElement) {
        siteMusic.pause();
    }
}, true);

// VİDEO DURAKLATILINCA ŞARKIYI TEKRAR BAŞLAT
document.addEventListener("pause", function(event) {
    if (!(event.target instanceof HTMLVideoElement)) return;

    const videos = document.querySelectorAll("video");
    const anotherVideoPlaying = Array.from(videos).some(function(video) {
        return video !== event.target && !video.paused && !video.ended;
    });

    if (!anotherVideoPlaying) {
        siteMusic.play().catch(function(error) {
            console.log("Şarkı yeniden başlatılamadı:", error);
        });
    }
}, true);

// VİDEO BİTİNCE ARKA PLAN ŞARKISINI TEKRAR BAŞLAT
document.addEventListener("ended", function(event) {
    if (!(event.target instanceof HTMLVideoElement)) return;

    const videos = document.querySelectorAll("video");
    const anotherVideoPlaying = Array.from(videos).some(function(video) {
        return video !== event.target && !video.paused && !video.ended;
    });

    if (!anotherVideoPlaying) {
        siteMusic.play().catch(function(error) {
            console.log("Şarkı yeniden başlatılamadı:", error);
        });
    }
}, true);

        let pageTimer;

        const heartsHTML = `
            <div class="inside-hearts" aria-hidden="true">
                <span>♡</span>
                <span>♡</span>
                <span>♡</span>
                <span>♡</span>
                <span>♡</span>
                <span>♡</span>
                <span>♡</span>
            </div>
        `;

        /* SAYFA İÇERİĞİNİ DEĞİŞTİR */

        function showPage(content) {
            clearTimeout(pageTimer);

            container.innerHTML = `
                ${heartsHTML}

                <div class="page-content">
                    ${content}
                </div>
            `;

            container.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });
        }

        /* HİKÂYEMİZ */

        function showStoryPage() {
            showPage(`
                <div id="storySection">

                    <h1>Hikâyemizin Başlangıcı ❤️</h1>

                    <p>
                        Bazı hikâyeler, daha başlamadan önce yazılmaya başlar…
                    </p>

                    <p>
                        Seni aslında geçen seneden beri seviyordum.
                        Ama aramızda bazı engeller vardı ve sana karşı
                        nasıl davranmam gerektiğini çoğu zaman bilmiyordum.
                    </p>

                    <p>
                        Sen farkında bile değilken sana bakmak, içimde oluşan
                        o heyecanı yaşamak bile benim için farklı bir histi.
                        Okey oynadığımız zamanlarda sana takılmalarım,
                        seni biraz sinirlendirmem bile hoşuma gidiyordu.
                        Çünkü seninle uğraşmak, senden bir tepki almak bile
                        bana iyi geliyordu.
                    </p>

                    <p>
                        Belki sen o zamanlar bunların hiçbirini fark etmiyordun.
                        Ama benim için küçücük bir bakışın bile çok şey ifade ediyordu.
                    </p>

                    <p>
                        Sana baktığımda, içimdeki o heyecanla birlikte
                        sanki karanlık dünyam aydınlanıyordu. ❤️
                    </p>

                    <p>
                        Ve şimdi, geçen sene sadece uzaktan hissettiğim
                        o şeyin bugün bizim hikâyemize dönüşmüş olması
                        benim için gerçekten çok özel.
                    </p>

                    <button id="memoriesButton">
                        Anılarımıza Bak ❤️
                    </button>

                </div>
            `);
        }

        /* GİRİŞ */

        loginForm.addEventListener("submit", function(event) {
            event.preventDefault();

            if (passwordInput.value === "0509") {
                showPage(`
                    <h1 class="page-transition">
                        Sana söylemek istediğim bazı şeyler var… ❤️
                    </h1>

                    <p class="page-transition">
                        Ama hepsini bir anda göremezsin.
                    </p>

                    <button id="startButton" class="page-transition">
                        Başla ❤️
                    </button>
                `);
            } else {
                alert("Şifre yanlış ❤️");
                passwordInput.value = "";
                passwordInput.focus();
            }
        });

        /* ŞARKIYI ÇAL */

        function playOurSong(songPath) {
            siteMusic.src = songPath;
            siteMusic.currentTime = 0;

            const playPromise = siteMusic.play();

            if (playPromise !== undefined) {
                playPromise.catch(function(error) {
                    console.log(
                        "Müzik başlatılamadı. Dosya yolunu kontrol et:",
                        error
                    );
                });
            }

            showPage(`
                <div class="song-start-screen">
                    <h1>Bizim şarkımız başladı… ❤️</h1>

                    <p>
                        Şimdi hikâyemize devam edelim.
                    </p>
                </div>
            `);

            pageTimer = setTimeout(function() {
                showStoryPage();
            }, 2200);
        }

        /* GİZLİ SÜRPRİZ SAYFASI */

        function showSurprisePage() {
            container.classList.add("page-changing");

            pageTimer = setTimeout(function() {
                showPage(`
                    <div class="surprise-page">

                        <p class="surprise-label">
                            Sadece sana özel bir şey… 💌
                        </p>

                        <h1>
                            Bir Şey mi Bitti Sandın Sevgilim? ❤️
                        </h1>

                        <p>
                            Aslında sana anlatacaklarım daha yeni başlıyor…
                        </p>

                        <div class="surprise-divider">
                            <span>♡</span>
                            <span>♡</span>
                            <span>♡</span>
                        </div>

                        <p>
                            Seninle yaşamak istediğim daha nice anı,
                            kurmak istediğim kocaman bir gelecek var.
                        </p>

                        <p>
                            Belki bugün sana anlatacaklarımın hepsini
                            bu siteye sığdıramadım. Ama birlikte yaşayacağımız
                            günlere daha çok şey sığdırmak istiyorum. ❤️
                        </p>

                        <p>
                            Birlikte güleceğimiz, birbirimize sarılacağımız,
                            bazen tartışıp sonra yine birbirimize döneceğimiz
                            nice günümüz olsun.
                        </p>

                        <div class="surprise-heart" aria-hidden="true">
                      ❤️
            </div>

                      <button id="revealLoveMessage" class="love-message-button">
                       Sana bir şey söylemek istiyorum… 💌
        </button>

                      <div id="loveMessage" class="love-message"></div>
                      <div id="floatingLoveHearts" class="floating-love-hearts"></div>

                        <!-- YENİ FOTOĞRAF VE VİDEO -->

                        <div class="surprise-media">

                            <h2>Bizden Bir Hatıra ❤️</h2>

                            <div class="surprise-photo">
                                <img
                                    src="images/surprise-photo.jpg"
                                    alt="Bizim güzel bir anımız"
                                    loading="lazy"
                                >
                            </div>

                            <div class="surprise-video">
                                <video
                                    controls
                                    playsinline
                                    preload="metadata"
                                >
                                    <source
                                        src="images/surprise-video.mp4"
                                        type="video/mp4"
                                    >
                                    Tarayıcın videoyu oynatamıyor.
                                </video>
                            </div>

                        </div>

                        <h2>Seni seviyorum Miniğim. ❤️</h2>

                        <p>
                            Ve bu hikâyenin en güzel yanı,
                            henüz yazılmamış olması…
                        </p>

                        <h2 class="surprise-ending">
                            Bu hikâyeyi seninle yazmak istiyorum. ♾️
                        </h2>

                        <p>
                            Daha başlangıçtayız sevgilim…
                            İyi ki varsın. ❤️
                        </p>

                        <div class="surprise-signature">
                            Sonsuza kadar bizim hikâyemiz…
                        </div>

                    </div>
                `);

                container.classList.remove("page-changing");
            }, 400);
        }

        /* TÜM SAYFA BUTONLARI */

        document.addEventListener("click", function(event) {
            const target = event.target;

            if (!(target instanceof Element)) {
                return;
            }

            /* BAŞLA → ŞARKI SEÇİMİ */

            if (target.closest("#startButton")) {
                showPage(`
                    <div id="songSelection">

                        <h1 class="page-transition">
                            Şarkımızı Seç 🎵❤️
                        </h1>

                        <p class="page-transition">
                            Hangisini dinlemek istersen…
                        </p>

                        <button id="song1Button" class="page-transition">
                            🎵 Bi' Bilsen
                        </button>

                        <button id="song2Button" class="page-transition">
                            🎵 PİRAYE
                        </button>

                    </div>
                `);
                return;
            }

            /* Bİ' BİLSEN */

            if (target.closest("#song1Button")) {
                playOurSong("images/bi-bilsen.mp3");
                return;
            }

            /* PİRAYE */

            if (target.closest("#song2Button")) {
                playOurSong("images/piraye.mp3");
                return;
            }

            /* ANILARIMIZ */

            if (target.closest("#memoriesButton")) {
                container.classList.add("page-changing");

                pageTimer = setTimeout(function() {
                    showPage(`
                        <h1 class="memories-title">
                            Anılarımız 📸❤️
                        </h1>

                        <p class="memories-intro">
                            Birlikte biriktirdiğimiz küçük ama güzel anılar...
                        </p>

                        <div class="memory-media">
                            <img
                                src="images/cocukluk.jpg"
                                alt="Çocukluk anımız"
                                class="memory-photo"
                                loading="lazy"
                            >
                        </div>

                        <p class="memory-text">
                            Bir zamanlar birbirimizden habersiz
                            iki küçük çocuk… ❤️
                        </p>

                        <p class="memory-text memory-text-second">
                            O zamanlar birbirimizi tanımıyorduk.
                            Şimdi ise geçmişimizin bile yan yana
                            olmasını istiyorum. ❤️
                        </p>

                        <div class="memory-second">
                            <div class="memory-media">
                                <img
                                    src="images/otogar.jpg"
                                    alt="Birlikte bir anımız"
                                    class="memory-photo"
                                    loading="lazy"
                                >
                            </div>

                            <p class="memory-text">
                                Bazı fotoğraflar yaşanmış bir anı değil,
                                yaşanmasını istediğimiz bir anı anlatır… ❤️
                            </p>

                            <p class="memory-text">
                                Belki bu anıyı gerçekten yaşamadık…
                                ama seninle daha yaşamadığımız o kadar
                                çok güzel an var ki. ❤️
                            </p>
                        </div>

                        <div class="memory-video">
                            <p class="memory-text">
                                Ve bazı anılar için fotoğraf yetmez… ❤️
                            </p>

                            <div class="memory-video-wrap">
                                <video
                                    controls
                                    class="memory-video-player"
                                    preload="metadata"
                                    playsinline
                                >
                                    <source
                                        src="images/tatli.mp4"
                                        type="video/mp4"
                                    >

                                    Tarayıcın videoyu desteklemiyor.
                                </video>
                            </div>

                            <p class="memory-text">
                                Seninle böyle sıradan görünen anları bile
                                çok seviyorum. Çünkü benim için önemli olan
                                ne yaptığımız değil, bunu kiminle yaptığım. ❤️
                            </p>
                        </div>

                        <button id="leftFromMemories">
                            Devam Et ❤️
                        </button>
                    `);

                    container.classList.remove("page-changing");
                }, 400);

                return;
            }

            /* SENDEN BANA KALANLAR */

            if (target.closest("#leftFromMemories")) {
                showPage(`
                    <h1>Senden Bana Kalanlar 💭❤️</h1>

                    <p class="memory-text">Gülüşün.</p>

                    <p class="memory-text">
                        Bazen hiçbir şey söylemeden bile
                        içimi değiştiren o gülüşün.
                    </p>

                    <p class="memory-text">Bakışın.</p>

                    <p class="memory-text">
                        Özellikle bana bakarken gözlerinin içinin parlaması…
                    </p>

                    <p class="memory-text">Bana bulaşmaların.</p>

                    <p class="memory-text">
                        Bazen sırf benimle uğraşmak için yaptığın
                        o küçük şeyler. 😄
                    </p>

                    <p class="memory-text">Kıskanman.</p>

                    <p class="memory-text">
                        Bazen modunu düşüren o küçücük şeylerin bile
                        bana ne kadar değer verdiğini hissettirmesi.
                    </p>

                    <p class="memory-text">
                        Arka koltuktan bana bakışın.
                    </p>

                    <p class="memory-text">
                        Belki de en sevdiğim anlardan biri.
                        Araba giderken aynadan göz göze geldiğimiz
                        o uzun bakışlar. ❤️
                    </p>

                    <p class="memory-text">
                        Bunların hepsi senden bana kalan küçük şeyler…
                    </p>

                    <p class="memory-text">
                        Ama aslında senden bana kalan en güzel şey,
                        senin kendinsin. ❤️
                    </p>

                    <button id="letterButton">
                        Mektubumu Oku 💌
                    </button>
                `);

                return;
            }

            /* MEKTUP */

            if (target.closest("#letterButton")) {
                showPage(`
                    <h1>Sana Bir Mektubum Var 💌</h1>

                    <div class="letter-box">

                        <p>
                            Bu sene o kadar güzeldi ki… Hani nasıl anlatsam,
                            yan yana olduğumuz her an, her saniye, her dakika
                            benim için ayrı güzeldi. Bana bakman, bakarken
                            çoğu zaman gözlerinin içinin parlaması, insanı
                            huzurlu hissettiren o bakışın, o gülümsemen…
                            Ya da bana bulaşmaların, aklına benimle ilgili
                            kötü bir şey geldiğinde kıskanman, modunun düşmesi…
                            Bunların bile bana değer verdiğini hissettirmesi
                            çok güzeldi.
                        </p>

                        <p>
                            Ama en çok hoşuma giden şeylerden biri,
                            ben araba kullanırken senin arka koltuktan
                            bana bakmandı. Araba giderken uzun uzun
                            bakışmalarımız… Bazen hiçbir şey söylemeden
                            sadece birbirimize bakmamız bile bana yetiyordu.
                            O anlarda sanki etraftaki her şey biraz olsun duruyordu.
                        </p>

                        <p>
                            Ben seninle sadece bugünümüzü değil,
                            geleceğimizi de inşa etmeye çalışıyorum.
                            Elimden geldiğince yanında huzur bulabileceğin,
                            kendin olabileceğin ve mutlu hissedebileceğin
                            bir insan olmak istiyorum. Seninle birlikte
                            kendi kişiliğimi de baştan inşa ediyorum.
                            Çünkü senin hayatıma girmenden sonra bazı şeylere,
                            kendime ve geleceğe bakışım bile değişti.
                        </p>

                        <p>
                            Seninle birlikte daha iyi bir ben olmak istiyorum.
                            Sadece seni seven biri olarak değil, sana iyi gelen,
                            yanında kendini güvende ve huzurlu hissettiğin
                            biri olarak kalmak istiyorum.
                        </p>

                        <p>
                            Ve belki de en güzeli, bütün bunları kusursuz
                            bir şekilde yapamıyor olsam bile, seninle birlikte
                            öğreniyor olmam. Çünkü benim için önemli olan
                            mükemmel bir ilişkiye sahip olmak değil;
                            seninle birlikte güzel bir hayat kurabilmek. ❤️
                        </p>

                    </div>

                    <button id="finalButton">
                        Sonuna Geliyoruz… ❤️
                    </button>
                `);

                return;
            }

            /* FİNAL */

            if (target.closest("#finalButton")) {
                showPage(`
                    <h1 class="final-text">
                        Buraya kadar benimle geldiğin için
                        teşekkür ederim. ❤️
                    </h1>

                    <p class="final-text">
                        Ama aslında sana anlatmak istediğim
                        her şeyi bu siteye sığdıramam.
                    </p>

                    <p class="final-text">
                        Çünkü bizim hikâyemiz daha yeni başlıyor… ❤️
                    </p>

                    <h2 class="final-heading">
                        Devamı gelecek…

                        <span
                            id="surpriseButton"
                            role="button"
                            tabindex="0"
                            aria-label="Gizli sürprizi aç"
                            title="Sana küçük bir sürprizim var"
                        >♾️</span>
                    </h2>

                    <p class="surprise-hint">
                        Psst… Sonsuzluk işaretine dokun ❤️
                    </p>
                `);

                return;
            }

            /* ♾️ GİZLİ SÜRPRİZİ AÇ */

            if (target.closest("#surpriseButton")) {
                showSurprisePage();
                return;
            }
        });

        /* KLAVYEYLE DE ♾️ İŞARETİNİ AÇABİL */

        document.addEventListener("keydown", function(event) {
            const target = event.target;

            if (
                target instanceof Element &&
                target.closest("#surpriseButton") &&
                (event.key === "Enter" || event.key === " ")
            ) {
                event.preventDefault();
                showSurprisePage();
            }
        });
    </script>
    <!-- FOTOĞRAF BÜYÜTME PENCERESİ -->
<div id="photoLightbox" class="photo-lightbox" aria-hidden="true">
    <button
        type="button"
        id="closePhotoLightbox"
        class="photo-lightbox-close"
        aria-label="Fotoğrafı kapat"
    >×</button>

    <img id="lightboxImage" src="" alt="Büyütülmüş fotoğraf">
</div>

<script>
(function () {
    const lightbox = document.getElementById("photoLightbox");
    const lightboxImage = document.getElementById("lightboxImage");
    const closeButton = document.getElementById("closePhotoLightbox");

    function closeLightbox() {
        lightbox.classList.remove("active");
        lightbox.setAttribute("aria-hidden", "true");
        lightboxImage.src = "";
        document.body.style.overflow = "";
    }

    document.addEventListener("click", function (event) {
        const photo = event.target.closest(
            ".memory-photo, .surprise-photo img"
        );

        if (photo) {
            lightboxImage.src = photo.src;
            lightboxImage.alt = photo.alt || "Büyütülmüş fotoğraf";
            lightbox.classList.add("active");
            lightbox.setAttribute("aria-hidden", "false");
            document.body.style.overflow = "hidden";
            return;
        }

        if (
            event.target === lightbox ||
            event.target === closeButton ||
            event.target === lightboxImage
        ) {
            closeLightbox();
        }
    });

    document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
            closeLightbox();
        }
    });
})();


</script>

<script>
(function () {
    const messageText =
        "Cemre'm, geçen günlerde belki sana sadece uzaktan bakıyordum. " +
        "Şimdi ise en güzel hayallerimi seninle kuruyorum. " +
        "Gülüşün ve gözlerin dünyamı güzelleştiriyor. " +
        "Seninle huzurlu bir gelecek kurmak ve hayatımı seninle güzelleştirmek istiyorum. " +
        "İyi ki hayatıma girdin. İyi ki biz olduk. Seni seviyorum. ❤️";

    document.addEventListener("click", function (event) {
        const button = event.target.closest("#revealLoveMessage");

        if (!button || button.dataset.opened === "true") {
            return;
        }

        const message = document.getElementById("loveMessage");
        const hearts = document.getElementById("floatingLoveHearts");

        if (!message || !hearts) {
            return;
        }

        button.dataset.opened = "true";
        button.textContent = "Bu mesaj sadece sana, Cemre'm ❤️";

        message.replaceChildren();

        const words = messageText.split(/\s+/);

        words.forEach(function (word, index) {
            const span = document.createElement("span");

            span.className = "message-word";
            span.textContent = word;
            span.style.animationDelay = (index * 0.12) + "s";

            message.appendChild(span);
        });

        for (let i = 0; i < 12; i++) {
            const heart = document.createElement("span");

            heart.textContent = "♥️";

            const direction = i % 2 === 0 ? 1 : -1;
            const distance = 25 + Math.random() * 100;

            heart.style.setProperty(
                "--heart-x",
                (direction * distance) + "px"
            );

            heart.style.left = (35 + Math.random() * 30) + "%";
            heart.style.animationDelay = (Math.random() * 1.2) + "s";

            hearts.appendChild(heart);

            heart.addEventListener("animationend", function () {
                heart.remove();
            });
        }
    });
})();
</script>
</body>
</html>
