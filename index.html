<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bizim Hikâyemiz ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="inside-hearts">
            <span>♡</span>
            <span>♡</span>
            <span>♡</span>
            <span>♡</span>
            <span>♡</span>
            <span>♡</span>
            <span>♡</span>
        </div>

        <div class="page-content">

            <h1>Sana özel bir yer… ❤️</h1>

            <p>Buraya sadece sen girebilirsin.</p>

            <input type="password" placeholder="Şifreni gir">

            <button>Giriş Yap ❤️</button>

        </div>

    </div>

    <!-- ARKA PLAN MÜZİĞİ -->
    <audio id="siteMusic" loop></audio>


    <script>

        const container = document.querySelector('.container');

        const siteMusic = document.getElementById('siteMusic');


        const heartsHTML = `
            <div class="inside-hearts">
                <span>♡</span>
                <span>♡</span>
                <span>♡</span>
                <span>♡</span>
                <span>♡</span>
                <span>♡</span>
                <span>♡</span>
            </div>
        `;


        function showPage(content) {

            container.innerHTML = `
                ${heartsHTML}

                <div class="page-content">
                    ${content}
                </div>
            `;

        }


        /* =========================
           HİKÂYEMİZ
        ========================= */

        function showStoryPage() {

            showPage(`
                <div id="storySection">

                    <h1>Hikâyemizin Başlangıcı ❤️</h1>

                    <p>
                        Bazı hikâyeler, daha başlamadan önce yazılmaya başlar…
                    </p>

                    <p>
                        Seni aslında geçen seneden beri seviyordum. Ama aramızda bazı engeller vardı ve sana karşı nasıl davranmam gerektiğini çoğu zaman bilmiyordum.
                    </p>

                    <p>
                        Sen farkında bile değilken sana bakmak, içimde oluşan o heyecanı yaşamak bile benim için farklı bir histi. Okey oynadığımız zamanlarda sana takılmalarım, seni biraz sinirlendirmem bile hoşuma gidiyordu. Çünkü seninle uğraşmak, senden bir tepki almak bile bana iyi geliyordu.
                    </p>

                    <p>
                        Belki sen o zamanlar bunların hiçbirini fark etmiyordun. Ama benim için küçücük bir bakışın bile çok şey ifade ediyordu.
                    </p>

                    <p>
                        Sana baktığımda, içimdeki o heyecanla birlikte sanki karanlık dünyam aydınlanıyordu. ❤️
                    </p>

                    <p>
                        Ve şimdi, geçen sene sadece uzaktan hissettiğim o şeyin bugün bizim hikâyemize dönüşmüş olması benim için gerçekten çok özel.
                    </p>

                    <button id="memoriesButton">
                        Anılarımıza Bak ❤️
                    </button>

                </div>
            `);

        }


        /* =========================
           GİRİŞ
        ========================= */

        const passwordInput = document.querySelector('input');
        const loginButton = document.querySelector('button');


        loginButton.addEventListener('click', function() {

            if (passwordInput.value === "0509") {

                showPage(`
                    <h1 class="page-transition">
                        Sana söylemek istediğim bazı şeyler var… ❤️
                    </h1>

                    <p class="page-transition">
                        Ama hepsini bir anda göremezsin.
                    </p>

                    <button id="startButton" class="page-transition">
                        Başla ❤️
                    </button>
                `);

            } else {

                alert("Şifre yanlış ❤️");

            }

        });


        /* =========================
           SAYFA BUTONLARI
        ========================= */

        document.addEventListener("click", function(e) {


            /* BAŞLA → ŞARKI SEÇİMİ */

            if (e.target.id === "startButton") {

                showPage(`

                    <div id="songSelection">

                        <h1 class="page-transition">
                            Şarkımızı Seç 🎵❤️
                        </h1>

                        <p class="page-transition">
                            Hangisini dinlemek istersen…
                        </p>

                        <button id="song1Button" class="page-transition">
                            🎵 Bi' Bilsen
                        </button>

                        <br><br>

                        <button id="song2Button" class="page-transition">
                            🎵 PİRAYE
                        </button>

                    </div>

                `);

            }


            /* Bİ' BİLSEN */

            if (e.target.id === "song1Button") {

                siteMusic.src = "images/bi-bilsen.mp3";

                siteMusic.play();

                showPage(`
                    <div class="song-start-screen">
                        <h1>Bizim şarkımız başladı… ❤️</h1>

                        <p>
                            Şimdi hikâyemize devam edelim.
                        </p>
                    </div>
                `);

                setTimeout(function() {
                    showStoryPage();
                }, 2200);

            }


            /* PİRAYE */

            if (e.target.id === "song2Button") {

                siteMusic.src = "images/piraye.mp3";

                siteMusic.play();

                showPage(`
                    <div class="song-start-screen">
                        <h1>Bizim şarkımız başladı… ❤️</h1>

                        <p>
                            Şimdi hikâyemize devam edelim.
                        </p>
                    </div>
                `);

                setTimeout(function() {
                    showStoryPage();
                }, 2200);

            }


            /* ANILARIMIZ */

            if (e.target.id === "memoriesButton") {

                container.classList.add("page-changing");

                setTimeout(function() {

                    showPage(`
                        <h1 class="memories-title">
                            Anılarımız 📸❤️
                        </h1>

                        <p class="memories-intro">
                            Birlikte biriktirdiğimiz küçük ama güzel anılar...
                        </p>


                        <div class="memory-media">

                            <img
                                src="images/cocukluk.jpg"
                                alt="Çocukluk anımız"
                                class="memory-photo"
                            >

                        </div>


                        <p class="memory-text">
                            Bir zamanlar birbirimizden habersiz iki küçük çocuk… ❤️
                        </p>

                        <p class="memory-text memory-text-second">
                            O zamanlar birbirimizi tanımıyorduk.
                            Şimdi ise geçmişimizin bile yan yana olmasını istiyorum. ❤️
                        </p>


                        <div class="memory-second">

                            <div class="memory-media">

                                <img
                                    src="images/otogar.jpg"
                                    alt="Birlikte bir anımız"
                                    class="memory-photo"
                                >

                            </div>


                            <p class="memory-text">
                                Bazı fotoğraflar yaşanmış bir anı değil,
                                yaşanmasını istediğimiz bir anı anlatır… ❤️
                            </p>

                            <p class="memory-text">
                                Belki bu anıyı gerçekten yaşamadık…
                                ama seninle daha yaşamadığımız o kadar çok güzel an var ki. ❤️
                            </p>

                        </div>


                        <div class="memory-video">

                            <p class="memory-text">
                                Ve bazı anılar için fotoğraf yetmez… ❤️
                            </p>


                            <div class="memory-video-wrap">

                                <video controls class="memory-video-player">

                                    <source
                                        src="images/tatli.mp4"
                                        type="video/mp4"
                                    >

                                    Tarayıcın videoyu desteklemiyor.

                                </video>

                            </div>


                            <p class="memory-text">
                                Seninle böyle sıradan görünen anları bile çok seviyorum.
                                Çünkü benim için önemli olan ne yaptığımız değil,
                                bunu kiminle yaptığım. ❤️
                            </p>

                        </div>


                        <button id="leftFromMemories">
                            Devam Et ❤️
                        </button>
                    `);

                    container.classList.remove("page-changing");

                }, 500);

            }


            /* SENDEN BANA KALANLAR */

            if (e.target.id === "leftFromMemories") {

                showPage(`
                    <h1>Senden Bana Kalanlar 💭❤️</h1>

                    <p class="memory-text">
                        Gülüşün.
                    </p>

                    <p class="memory-text">
                        Bazen hiçbir şey söylemeden bile içimi değiştiren o gülüşün.
                    </p>

                    <p class="memory-text">
                        Bakışın.
                    </p>

                    <p class="memory-text">
                        Özellikle bana bakarken gözlerinin içinin parlaması…
                    </p>

                    <p class="memory-text">
                        Bana bulaşmaların.
                    </p>

                    <p class="memory-text">
                        Bazen sırf benimle uğraşmak için yaptığın o küçük şeyler. 😄
                    </p>

                    <p class="memory-text">
                        Kıskanman.
                    </p>

                    <p class="memory-text">
                        Bazen modunu düşüren o küçücük şeylerin bile bana ne kadar değer verdiğini hissettirmesi.
                    </p>

                    <p class="memory-text">
                        Arka koltuktan bana bakışın.
                    </p>

                    <p class="memory-text">
                        Belki de en sevdiğim anlardan biri.
                        Araba giderken aynadan göz göze geldiğimiz o uzun bakışlar. ❤️
                    </p>

                    <p class="memory-text">
                        Bunların hepsi senden bana kalan küçük şeyler…
                    </p>

                    <p class="memory-text">
                        Ama aslında senden bana kalan en güzel şey, senin kendinsin. ❤️
                    </p>

                    <button id="letterButton">
                        Mektubumu Oku 💌
                    </button>
                `);

            }


            /* MEKTUP */

            if (e.target.id === "letterButton") {

                showPage(`
                    <h1>Sana Bir Mektubum Var 💌</h1>

                    <div class="letter-box">

                        <p>
                            Bu sene o kadar güzeldi ki… Hani nasıl anlatsam, yan yana olduğumuz her an, her saniye, her dakika benim için ayrı güzeldi. Bana bakman, bakarken çoğu zaman gözlerinin içinin parlaması, insanı huzurlu hissettiren o bakışın, o gülümsemen… Ya da bana bulaşmaların, aklına benimle ilgili kötü bir şey geldiğinde kıskanman, modunun düşmesi… Bunların bile bana değer verdiğini hissettirmesi çok güzeldi.
                        </p>

                        <p>
                            Ama en çok hoşuma giden şeylerden biri, ben araba kullanırken senin arka koltuktan bana bakmandı. Araba giderken uzun uzun bakışmalarımız… Bazen hiçbir şey söylemeden sadece birbirimize bakmamız bile bana yetiyordu. O anlarda sanki etraftaki her şey biraz olsun duruyordu.
                        </p>

                        <p>
                            Ben seninle sadece bugünümüzü değil, geleceğimizi de inşa etmeye çalışıyorum. Elimden geldiğince yanında huzur bulabileceğin, kendin olabileceğin ve mutlu hissedebileceğin bir insan olmak istiyorum. Seninle birlikte kendi kişiliğimi de baştan inşa ediyorum. Çünkü senin hayatıma girmenden sonra bazı şeylere, kendime ve geleceğe bakışım bile değişti.
                        </p>

                        <p>
                            Seninle birlikte daha iyi bir ben olmak istiyorum. Sadece seni seven biri olarak değil, sana iyi gelen, yanında kendini güvende ve huzurlu hissettiğin biri olarak kalmak istiyorum.
                        </p>

                        <p>
                            Ve belki de en güzeli, bütün bunları kusursuz bir şekilde yapamıyor olsam bile, seninle birlikte öğreniyor olmam. Çünkü benim için önemli olan mükemmel bir ilişkiye sahip olmak değil; seninle birlikte güzel bir hayat kurabilmek. ❤️
                        </p>

                    </div>

                    <button id="finalButton">
                        Sonuna Geliyoruz… ❤️
                    </button>
                `);

            }


            /* FİNAL */

            if (e.target.id === "finalButton") {

                showPage(`
                    <h1 class="final-text">
                        Buraya kadar benimle geldiğin için teşekkür ederim. ❤️
                    </h1>

                    <p class="final-text">
                        Ama aslında sana anlatmak istediğim her şeyi bu siteye sığdıramam.
                    </p>

                    <p class="final-text">
                        Çünkü bizim hikâyemiz daha yeni başlıyor… ❤️
                    </p>

                    <h2 class="final-text">
                        Devamı gelecek… ♾️
                    </h2>
                `);

            }

        });

    </script>

</body>
</html>
